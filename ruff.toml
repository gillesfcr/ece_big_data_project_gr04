line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
# N812: `functions as F` is the usual PySpark convention
# UP038: isinstance with a tuple is kept for readability
ignore = ["N812", "UP038"]

[lint.isort]
known-first-party = ["config", "spark_utils", "datasets", "explore_people", "wikimedia_client"]
